<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Cube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">
        <div class="cube">
            <div class="face front"><img src="https://via.placeholder.com/300?text=Front" alt="Front"></div>
            <div class="face back"><img src="https://via.placeholder.com/300?text=Back" alt="Back"></div>
            <div class="face right"><img src="https://via.placeholder.com/300?text=Right" alt="Right"></div>
            <div class="face left"><img src="https://via.placeholder.com/300?text=Left" alt="Left"></div>
            <div class="face top"><img src="https://via.placeholder.com/300?text=Top" alt="Top"></div>
            <div class="face bottom"><img src="https://via.placeholder.com/300?text=Bottom" alt="Bottom"></div>
        </div>
    </div>
</body>
</html>
